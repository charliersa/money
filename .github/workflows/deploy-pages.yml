name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages 需要 pages:write 才能自動開啟 Pages，deploy-pages 需要 id-token
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的，避免半途中斷
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 注意：GITHUB_TOKEN 沒有建立 Pages 站台的權限（那需要 administration:write），
      # 所以第一次必須在 Settings → Pages 手動把 Source 設為 GitHub Actions。
      # 設定完成後這一步只是讀取設定，不會再失敗。
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pwa/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pwa

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
