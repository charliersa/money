<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>財務管家</title>
<meta name="description" content="記帳、預算、資產、保險與財務分析，資料全部留在你的裝置上。">
<meta name="theme-color" content="#F0F5FE">
<meta name="color-scheme" content="light dark">
<!-- Search Console 網址前置字元屬性 https://charliersa.github.io/money/ 的擁有權驗證 -->
<meta name="google-site-verification" content="zegXZOpI6gQa40MKmBise2QF3-WEJWdvMb4yw9HaeDY">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財務管家">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── 設計稿原有的動畫與變數（原封不動） ───────────────────── */
@keyframes slideUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes toastIn { from { transform: translateY(-16px) translateX(-50%); opacity:0; } to { transform: translateY(0) translateX(-50%); opacity:1; } }
@keyframes scanLine { 0%,100%{top:8%} 50%{top:80%} }
@keyframes waveA { 0%,100%{height:6px} 50%{height:30px} }
@keyframes waveB { 0%,100%{height:10px} 50%{height:46px} }
@keyframes waveC { 0%,100%{height:5px} 50%{height:38px} }
@keyframes spin { to{transform:rotate(360deg)} }

:root {
  --outer-bg:#E4ECF8; --app-bg:#F0F5FE; --card-bg:#FFFFFF; --card-bg2:#EAF0FD;
  --text-1:#0D1B2E; --text-2:#1D3154; --text-3b:#3A5278; --text-3:#526898;
  --text-4:#7090B0; --text-5:#96B0CC; --text-6:#B0C4DC;
  --border-1:rgba(70,100,160,0.07); --input-bg:rgba(70,100,160,0.04);
  --border-2:rgba(70,100,160,0.10); --border-3:rgba(70,100,160,0.07);
  --border-4:rgba(70,100,160,0.10);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--outer-bg);
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overscroll-behavior: none;                 /* 關掉整頁下拉刷新，行為才像原生 App */
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { display: none; }
#analysis-pills { scrollbar-width: thin; scrollbar-color: rgba(108,142,245,0.35) transparent; }
#analysis-pills::-webkit-scrollbar { display: block !important; height: 4px; }
#analysis-pills::-webkit-scrollbar-thumb { background: rgba(108,142,245,0.35); border-radius: 2px; }
#analysis-pills::-webkit-scrollbar-track { background: transparent; }
a { color: inherit; text-decoration: none; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }
input::placeholder { color: var(--text-6); }
input:focus { border-color: rgba(108,142,245,0.4) !important; }
select option { background: var(--card-bg); color: var(--text-1); }

/* ── PWA 外殼：桌機保留手機外框，手機／獨立視窗滿版 ───────── */
.app-shell {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px 0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 15%, rgba(108,142,245,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 85%, rgba(167,139,250,0.09) 0%, transparent 55%),
    var(--outer-bg);
}
.app-frame {
  width: 390px; height: 844px; max-height: calc(100dvh - 40px);
  background: var(--app-bg);
  border-radius: 44px; overflow: hidden; position: relative;
  display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px rgba(108,142,245,0.18), 0 32px 80px rgba(13,27,46,0.28);
}
.app-scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

@media (max-width: 480px), (display-mode: standalone), (display-mode: fullscreen) {
  .app-shell { padding: 0; background: var(--app-bg); align-items: stretch; }
  .app-frame {
    width: 100%; height: 100dvh; max-height: none;
    border-radius: 0; box-shadow: none;
  }
  /* 假的 9:41 狀態列在真機上是多餘的，收成安全區墊片 */
  .status-bar { height: env(safe-area-inset-top, 0px) !important; padding: 0 !important; }
  .status-bar > * { display: none !important; }
  .tab-bar { height: auto !important; min-height: 78px;
             padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
  .fab-wrap { bottom: calc(90px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* ── 加入主畫面提示 ──────────────────────────────────────── */
#install-bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 200; display: none; align-items: center; gap: 10px;
  background: var(--card-bg); color: var(--text-1);
  border: 1px solid rgba(108,142,245,0.25); border-radius: 18px;
  padding: 10px 12px 10px 16px; font-size: 13px; font-weight: 600;
  box-shadow: 0 10px 30px rgba(13,27,46,0.25); white-space: nowrap;
}
#install-bar button {
  font: inherit; font-weight: 700; cursor: pointer; border: none;
  border-radius: 12px; padding: 8px 14px; color: #fff;
  background: linear-gradient(135deg,#6C8EF5,#A78BFA);
}
#install-bar .dismiss { background: var(--border-1); color: var(--text-3); }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-frame" id="app-root"></div>
</div>

<div id="install-bar" role="dialog" aria-label="安裝應用程式">
  <span>把「財務管家」加入主畫面？</span>
  <button type="button" id="install-yes">安裝</button>
  <button type="button" class="dismiss" id="install-no">稍後</button>
</div>

<script type="text/x-template" id="app-template">
<!-- Status Bar -->
  <div class="status-bar" style="height:44px;padding:14px 28px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <span style="font-size:13px;font-weight:700;color:var(--text-1);letter-spacing:-0.3px;">{{ clockText }}</span>
    <div style="display:flex;gap:5px;align-items:center;">
      <div style="display:flex;gap:2px;align-items:flex-end;"><div style="width:3px;height:5px;background:var(--text-1);border-radius:1px;"></div><div style="width:3px;height:7px;background:var(--text-1);border-radius:1px;"></div><div style="width:3px;height:9px;background:var(--text-1);border-radius:1px;"></div><div style="width:3px;height:11px;background:var(--text-1);border-radius:1px;opacity:0.25;"></div></div>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 8.5a1 1 0 110 2 1 1 0 010-2z" fill="var(--text-1)"/><path d="M5 6.5C5.9 5.6 6.9 5 8 5s2.1.6 3 1.5" stroke="var(--text-1)" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M2.5 4C4.1 2.4 5.9 1.5 8 1.5s3.9.9 5.5 2.5" stroke="var(--text-1)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/></svg>
      <div style="display:flex;align-items:center;gap:1px;"><div style="width:23px;height:11px;border:1.5px solid rgba(255,255,255,0.45);border-radius:3px;padding:1.5px;"><div style="width:75%;height:100%;background:var(--text-1);border-radius:1px;"></div></div><div style="width:2px;height:5px;background:rgba(255,255,255,0.4);border-radius:0 1px 1px 0;"></div></div>
    </div>
  </div>

  <!-- Header -->
  <div style="padding:10px 24px 6px;flex-shrink:0;">
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="animation:fadeIn 0.3s ease;"><div style="font-size:12px;color:var(--text-3);font-weight:500;margin-bottom:1px;">歡迎回來 👋</div><div style="font-size:23px;font-weight:800;color:var(--text-1);letter-spacing:-0.6px;">財務總覽</div></div>
    </sc-if>
    <sc-if value="{{ isRecords }}" hint-placeholder-val="{{ false }}">
      <div style="animation:fadeIn 0.3s ease;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:23px;font-weight:800;color:var(--text-1);letter-spacing:-0.6px;">帳簿管理</div>
        <div onClick="{{ openExpenseTx }}" style="font-size:12px;color:#6C8EF5;font-weight:600;background:rgba(108,142,245,0.1);padding:7px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(108,142,245,0.2);">+ 新增</div>
      </div>
    </sc-if>
    <sc-if value="{{ isAnalysis }}" hint-placeholder-val="{{ false }}"><div style="animation:fadeIn 0.3s ease;font-size:23px;font-weight:800;color:var(--text-1);letter-spacing:-0.6px;">財務分析</div></sc-if>
    <sc-if value="{{ isInsurance }}" hint-placeholder-val="{{ false }}">
      <div style="animation:fadeIn 0.3s ease;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:23px;font-weight:800;color:var(--text-1);letter-spacing:-0.6px;">保險保障</div>
        <div onClick="{{ openPolicySheet }}" style="font-size:12px;color:#A78BFA;font-weight:600;background:rgba(167,139,250,0.1);padding:7px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(167,139,250,0.2);">+ 新增保單</div>
      </div>
    </sc-if>
    <sc-if value="{{ isProfile }}" hint-placeholder-val="{{ false }}">
      <div style="animation:fadeIn 0.3s ease;display:flex;align-items:center;gap:10px;">
        <sc-if value="{{ isProfileSub }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ backToProfile }}" style="width:34px;height:34px;background:rgba(108,142,245,0.1);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(108,142,245,0.15);">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7l4-4" stroke="#6C8EF5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </sc-if>
        <div style="font-size:23px;font-weight:800;color:var(--text-1);letter-spacing:-0.6px;">{{ profileTitle }}</div>
      </div>
    </sc-if>
  </div>

  <!-- Content -->
  <div class="app-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;">

    <!-- ═══ HOME ═══ -->
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="animation:slideUp 0.35s ease;padding:8px 20px 100px;">
        <div style="background:linear-gradient(135deg,var(--card-bg2) 0%,var(--card-bg2) 60%,var(--card-bg2) 100%);border-radius:24px;padding:26px 24px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(108,142,245,0.22);">
          <div style="position:absolute;top:-30px;right:-30px;width:130px;height:130px;background:radial-gradient(circle, rgba(108,142,245,0.18) 0%, transparent 70%);border-radius:50%;pointer-events:none;"></div>
          <div style="font-size:11px;color:var(--text-4);font-weight:600;margin-bottom:6px;letter-spacing:0.8px;text-transform:uppercase;">淨資產</div>
          <div style="font-size:38px;font-weight:800;color:var(--text-1);letter-spacing:-2px;line-height:1;margin-bottom:6px;">{{ netWorthText }}</div>
          <div style="font-size:12px;color:var(--text-3);">{{ netWorthSub }}</div>
          <div style="display:flex;gap:16px;margin-top:18px;">
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:6px;height:6px;border-radius:50%;background:#34D399;"></div><span style="font-size:12px;color:var(--text-3);">收入 {{ allIncomeText }}</span></div>
            <div style="display:flex;align-items:center;gap:6px;"><div style="width:6px;height:6px;border-radius:50%;background:#F87171;"></div><span style="font-size:12px;color:var(--text-3);">支出 {{ allExpenseText }}</span></div>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:14px;">
          <div style="flex:1;background:var(--card-bg);border-radius:18px;padding:16px;border:1px solid rgba(52,211,153,0.15);">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">
              <div style="width:28px;height:28px;background:rgba(52,211,153,0.12);border-radius:9px;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 11V2M3 5.5l3.5-3.5 3.5 3.5" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <span style="font-size:11px;color:var(--text-3);font-weight:500;">本月收入</span>
            </div>
            <div style="font-size:19px;font-weight:700;color:#34D399;letter-spacing:-0.5px;">{{ monthIncomeText }}</div>
          </div>
          <div style="flex:1;background:var(--card-bg);border-radius:18px;padding:16px;border:1px solid rgba(248,113,113,0.15);">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">
              <div style="width:28px;height:28px;background:rgba(248,113,113,0.12);border-radius:9px;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 2v9M10 8l-3.5 3.5L3 8" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <span style="font-size:11px;color:var(--text-3);font-weight:500;">本月支出</span>
            </div>
            <div style="font-size:19px;font-weight:700;color:#F87171;letter-spacing:-0.5px;">{{ monthExpenseText }}</div>
          </div>
        </div>

        <!-- Budget Preview -->
        <div style="background:var(--card-bg);border-radius:20px;padding:18px 20px;margin-bottom:14px;border:1px solid var(--border-1);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:14px;font-weight:700;color:var(--text-1);">預算執行</div>
            <div onClick="{{ goBudget }}" style="font-size:12px;color:#6C8EF5;cursor:pointer;font-weight:600;">管理 →</div>
          </div>
          <sc-if value="{{ hasBudget }}" hint-placeholder-val="{{ false }}">
            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                <span style="font-size:12px;color:var(--text-3b);">{{ budgetSpentText }} / {{ budgetTotalText }}</span>
                <span style="font-size:12px;color:#6C8EF5;font-weight:600;">{{ budgetPctText }}</span>
              </div>
              <div style="background:var(--border-3);border-radius:6px;height:7px;overflow:hidden;"><div style="width:{{ budgetPctWidth }};height:100%;background:linear-gradient(90deg,#6C8EF5,#A78BFA);border-radius:6px;transition:width 0.6s ease;"></div></div>
              <div style="font-size:11px;color:var(--text-3);margin-top:6px;">結餘 {{ budgetRemainText }}</div>
            </div>
          </sc-if>
          <sc-if value="{{ noBudget }}" hint-placeholder-val="{{ true }}">
            <div style="text-align:center;padding:8px 0 4px;">
              <div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">尚未設定預算目標</div>
              <div onClick="{{ goBudget }}" style="display:inline-block;font-size:12px;color:#6C8EF5;background:rgba(108,142,245,0.1);padding:7px 18px;border-radius:20px;cursor:pointer;font-weight:600;border:1px solid rgba(108,142,245,0.2);">立即設定</div>
            </div>
          </sc-if>
        </div>

        <!-- Recent Transactions -->
        <div style="background:var(--card-bg);border-radius:20px;padding:18px 20px;margin-bottom:14px;border:1px solid var(--border-1);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:14px;font-weight:700;color:var(--text-1);">最近交易</div>
            <div onClick="{{ goRecords }}" style="font-size:12px;color:#6C8EF5;cursor:pointer;font-weight:600;">全部 →</div>
          </div>
          <sc-if value="{{ hasRecentTxs }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ recentTxs }}" as="tx" hint-placeholder-count="0">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--input-bg);">
                <div style="display:flex;align-items:center;gap:10px;">
                  <div style="width:36px;height:36px;background:var(--border-1);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;">{{ tx.emoji }}</div>
                  <div><div style="font-size:13px;font-weight:600;color:var(--text-1);">{{ tx.category }}</div><div style="font-size:11px;color:var(--text-3);">{{ tx.dateDisplay }}</div></div>
                </div>
                <div style="font-size:14px;font-weight:700;color:{{ tx.amountColor }};">{{ tx.amountText }}</div>
              </div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ noRecentTxs }}" hint-placeholder-val="{{ true }}">
            <div style="text-align:center;padding:10px 0;"><div style="font-size:12px;color:var(--text-3);margin-bottom:8px;">尚無交易記錄</div><div onClick="{{ openExpenseTx }}" style="display:inline-block;font-size:12px;font-weight:600;color:#6C8EF5;background:rgba(108,142,245,0.1);padding:7px 16px;border-radius:20px;cursor:pointer;border:1px solid rgba(108,142,245,0.2);">記錄第一筆</div></div>
          </sc-if>
        </div>

        <!-- Insurance Preview -->
        <div style="background:var(--card-bg);border-radius:20px;padding:18px 20px;border:1px solid rgba(167,139,250,0.15);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;background:rgba(167,139,250,0.12);border-radius:9px;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1l4.5 1.8V7c0 2.7-1.8 5-4.5 6.3C4.3 12 2.5 9.7 2.5 7V2.8L7 1z" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-size:14px;font-weight:700;color:var(--text-1);">保險保障</div></div>
            <div onClick="{{ goInsurance }}" style="font-size:12px;color:#A78BFA;cursor:pointer;font-weight:600;">管理 →</div>
          </div>
          <div style="display:flex;gap:10px;">
            <div style="flex:1;background:rgba(167,139,250,0.06);border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(167,139,250,0.1);"><div style="font-size:22px;font-weight:800;color:#A78BFA;">{{ policyCount }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">有效保單</div></div>
            <div style="flex:1;background:rgba(248,113,113,0.06);border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(248,113,113,0.1);"><div style="font-size:22px;font-weight:800;color:#F87171;">{{ gapCount }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">保障缺口</div></div>
            <div style="flex:1;background:rgba(233,180,76,0.06);border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(233,180,76,0.1);"><div style="font-size:16px;font-weight:800;color:#E9B44C;letter-spacing:-0.5px;">{{ annualPremiumText }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">年繳保費</div></div>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ═══ RECORDS ═══ -->
    <sc-if value="{{ isRecords }}" hint-placeholder-val="{{ false }}">
      <div style="animation:slideUp 0.35s ease;">
        <div style="padding:0 20px;margin-bottom:14px;">
          <div style="display:flex;gap:0;background:var(--card-bg);border-radius:14px;padding:3px;border:1px solid var(--border-1);">
            <div onClick="{{ setRecordsTab_transactions }}" style="flex:1;padding:8px;text-align:center;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;background:{{ recTransBg }};color:{{ recTransColor }};transition:all 0.2s;">記帳記錄</div>
            <div onClick="{{ setRecordsTab_budget }}" style="flex:1;padding:8px;text-align:center;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;background:{{ recBudgetBg }};color:{{ recBudgetColor }};transition:all 0.2s;">預算管理</div>
          </div>
        </div>

        <!-- TRANSACTIONS -->
        <sc-if value="{{ isTransactions }}" hint-placeholder-val="{{ true }}">
          <div style="padding:0 20px 100px;">
            <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px;">

            <sc-if value="{{ hasTxs }}" hint-placeholder-val="{{ false }}">

                <sc-for list="{{ currentMonthTxItems }}" as="tx" hint-placeholder-count="0">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--input-bg);">

                      <div>
                        <div style="display:flex;align-items:center;gap:6px;">

                          <sc-if value="{{ tx.hasBank }}" hint-placeholder-val="{{ false }}"><div style="font-size:10px;font-weight:600;color:#6C8EF5;background:rgba(108,142,245,0.1);border:1px solid rgba(108,142,245,0.18);border-radius:8px;padding:2px 7px;white-space:nowrap;">{{ tx.bankLabel }}</div></sc-if>

                      <div onClick="{{ tx.onDelete }}" style="font-size:10px;color:var(--text-6);cursor:pointer;">刪除</div>

            <sc-if value="{{ noTxs }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;align-items:center;padding:30px 0;">

                <div style="font-size:12px;color:var(--text-3);text-align:center;margin-bottom:18px;">點擊右下角「+」記錄收支</div>
                <div onClick="{{ openExpenseTx }}" style="font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6C8EF5,#A78BFA);padding:11px 26px;border-radius:20px;cursor:pointer;">記錄第一筆</div>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <!-- BUDGET -->
        <sc-if value="{{ isBudgetPage }}" hint-placeholder-val="{{ false }}">
          <div style="padding:0 20px 100px;">
            <div style="background:linear-gradient(135deg,var(--card-bg2),var(--card-bg2));border-radius:20px;padding:18px 20px;margin-bottom:14px;border:1px solid rgba(108,142,245,0.2);">
              <div style="font-size:11px;color:var(--text-4);font-weight:600;margin-bottom:5px;letter-spacing:0.6px;">本月預算總覽</div>
              <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:12px;">
                <div style="font-size:28px;font-weight:800;color:var(--text-1);letter-spacing:-1px;">{{ budgetSpentText }}</div>
                <div style="font-size:13px;color:var(--text-3);margin-bottom:4px;">/ {{ budgetTotalText }}</div>
              </div>
              <div style="background:var(--border-3);border-radius:6px;height:6px;overflow:hidden;"><div style="width:{{ budgetPctWidth }};height:100%;background:linear-gradient(90deg,#6C8EF5,#A78BFA);border-radius:6px;transition:width 0.6s ease;"></div></div>
              <div style="font-size:11px;color:var(--text-3);margin-top:6px;">結餘 {{ budgetRemainText }}</div>

                  <div style="display:flex;align-items:center;gap:9px;"><div style="font-size:18px;">{{ bud.emoji }}</div><div><div style="font-size:13px;font-weight:600;color:var(--text-1);">{{ bud.name }}</div><div style="font-size:11px;color:var(--text-3);">{{ bud.spentText }} / {{ bud.limitText }}</div></div></div>
                  <div onClick="{{ bud.onSetBudget }}" style="font-size:12px;color:#6C8EF5;cursor:pointer;font-weight:600;">設定</div>
                </div>
                <div style="background:var(--border-3);border-radius:4px;height:5px;overflow:hidden;"><div style="width:{{ bud.pctWidth }};height:100%;background:{{ bud.barColor }};border-radius:4px;transition:width 0.5s ease;"></div></div>
                <sc-if value="{{ bud.hasNote }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:11px;color:var(--text-3);margin-top:9px;line-height:1.6;word-break:break-word;">📝 {{ bud.note }}</div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- ═══ ANALYSIS ═══ -->
    <sc-if value="{{ isAnalysis }}" hint-placeholder-val="{{ false }}">

        <div id="analysis-pills" style="display:flex;gap:7px;padding:0 20px;overflow-x:auto;margin-bottom:16px;padding-bottom:6px;">
          <div onClick="{{ setAnalysisTab_trend }}" style="white-space:nowrap;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;background:{{ trendBg }};color:{{ trendColor }};border:{{ trendBorder }};transition:all 0.2s;">月度趨勢</div>
          <div onClick="{{ setAnalysisTab_category }}" style="white-space:nowrap;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;background:{{ catBg }};color:{{ catColor }};border:{{ catBorder }};transition:all 0.2s;">支出分類</div>
          <div onClick="{{ setAnalysisTab_assets }}" style="white-space:nowrap;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;background:{{ assetsBg }};color:{{ assetsColor }};border:{{ assetsBorder }};transition:all 0.2s;">資產配置</div>
          <div onClick="{{ setAnalysisTab_cashflow }}" style="white-space:nowrap;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;background:{{ cashBg }};color:{{ cashColor }};border:{{ cashBorder }};transition:all 0.2s;">現金流量</div>
          <div onClick="{{ setAnalysisTab_premium }}" style="white-space:nowrap;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;background:{{ premBg }};color:{{ premColor }};border:{{ premBorder }};transition:all 0.2s;">保費比例</div>
        </div>

          <sc-if value="{{ isTrend }}" hint-placeholder-val="{{ true }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">月度收支趨勢</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:14px;">近 6 個月收入與支出走勢</div>
              <div style="height:190px;"><canvas id="chart-trend"></canvas></div>
            </div>
          </sc-if>
          <sc-if value="{{ isCategory }}" hint-placeholder-val="{{ false }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">支出類別分析</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:14px;">本月各類別支出占比</div>
              <div style="height:190px;display:flex;align-items:center;justify-content:center;"><canvas id="chart-category"></canvas></div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
                <div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:#6C8EF5;"></div><span style="font-size:11px;color:var(--text-3);">餐飲</span></div>
                <div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:#34D399;"></div><span style="font-size:11px;color:var(--text-3);">交通</span></div>
                <div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:#E9B44C;"></div><span style="font-size:11px;color:var(--text-3);">娛樂</span></div>
                <div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:#F87171;"></div><span style="font-size:11px;color:var(--text-3);">購物</span></div>
                <div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:#A78BFA;"></div><span style="font-size:11px;color:var(--text-3);">其他</span></div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ isAssets }}" hint-placeholder-val="{{ false }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">資產配置分析</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:14px;">各類資產佔比</div>
              <div style="height:180px;display:flex;align-items:center;justify-content:center;"><canvas id="chart-assets"></canvas></div>
              <div style="margin-top:14px;">
                <sc-for list="{{ assetItems }}" as="ast" hint-placeholder-count="4">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--input-bg);">
                    <div style="display:flex;align-items:center;gap:8px;"><div style="width:9px;height:9px;border-radius:3px;background:{{ ast.color }};"></div><span style="font-size:13px;color:var(--text-3b);">{{ ast.key }}</span></div>
                    <span style="font-size:13px;color:var(--text-1);font-weight:600;">{{ ast.amountText }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ isCashflow }}" hint-placeholder-val="{{ false }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">現金流量</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:14px;">近 6 個月流入與流出</div>
              <div style="height:190px;"><canvas id="chart-cashflow"></canvas></div>
            </div>
          </sc-if>
          <sc-if value="{{ isPremium }}" hint-placeholder-val="{{ false }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">保費支出分析</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:14px;">各險種年繳保費比例</div>
              <div style="height:180px;display:flex;align-items:center;justify-content:center;"><canvas id="chart-premium"></canvas></div>

              </div>
            </div>
          </sc-if>
          <div onClick="{{ triggerAI }}" style="background:linear-gradient(135deg,rgba(108,142,245,0.12),rgba(167,139,250,0.12));border:1px solid rgba(108,142,245,0.25);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:14px;">

            <div style="flex:1;"><div style="font-size:14px;font-weight:700;color:var(--text-1);">AI 智慧分析</div><div style="font-size:12px;color:var(--text-4);margin-top:2px;">點擊獲取個人化財務建議</div></div>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#6C8EF5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ═══ INSURANCE ═══ -->
    <sc-if value="{{ isInsurance }}" hint-placeholder-val="{{ false }}">
      <div style="animation:slideUp 0.35s ease;">
        <div style="padding:0 20px;margin-bottom:14px;">
          <div style="display:flex;background:var(--card-bg);border-radius:14px;padding:3px;border:1px solid var(--border-1);">
            <div onClick="{{ setInsuranceTab_policies }}" style="flex:1;padding:8px;text-align:center;border-radius:11px;font-size:12px;font-weight:600;cursor:pointer;background:{{ polBg }};color:{{ polColor }};transition:all 0.2s;">我的保單</div>
            <div onClick="{{ setInsuranceTab_coverage }}" style="flex:1;padding:8px;text-align:center;border-radius:11px;font-size:12px;font-weight:600;cursor:pointer;background:{{ covBg }};color:{{ covColor }};transition:all 0.2s;">保障分析</div>
            <div onClick="{{ setInsuranceTab_claims }}" style="flex:1;padding:8px;text-align:center;border-radius:11px;font-size:12px;font-weight:600;cursor:pointer;background:{{ claimsBg }};color:{{ claimsColor }};transition:all 0.2s;">理賠記錄</div>
          </div>
        </div>
        <div style="padding:0 20px 100px;">
          <sc-if value="{{ isPolicies }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;gap:10px;margin-bottom:14px;">
              <div style="flex:1;background:var(--card-bg);border-radius:14px;padding:12px;border:1px solid rgba(167,139,250,0.15);text-align:center;"><div style="font-size:22px;font-weight:800;color:#A78BFA;">{{ policyCount }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">有效保單</div></div>
              <div style="flex:1;background:var(--card-bg);border-radius:14px;padding:12px;border:1px solid var(--border-1);text-align:center;"><div style="font-size:15px;font-weight:800;color:var(--text-1);letter-spacing:-0.5px;">{{ annualPremiumText }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">年繳保費</div></div>
              <div style="flex:1;background:var(--card-bg);border-radius:14px;padding:12px;border:1px solid rgba(233,180,76,0.15);text-align:center;"><div style="font-size:22px;font-weight:800;color:#E9B44C;">{{ gapCount }}</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">保障缺口</div></div>
            </div>
            <sc-if value="{{ hasPolicies }}" hint-placeholder-val="{{ false }}">
              <sc-for list="{{ policyItems }}" as="pol" hint-placeholder-count="0">
                <div style="background:var(--card-bg);border-radius:16px;padding:14px 16px;border:1px solid rgba(167,139,250,0.12);margin-bottom:10px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                    <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:22px;">{{ pol.typeEmoji }}</span><div><div style="font-size:14px;font-weight:700;color:var(--text-1);">{{ pol.name }}</div><div style="font-size:11px;color:var(--text-3);">{{ pol.company }} · {{ pol.type }}</div></div></div>
                    <div onClick="{{ pol.onDelete }}" style="font-size:11px;color:var(--text-6);cursor:pointer;padding:4px 8px;background:rgba(248,113,113,0.08);border-radius:8px;">刪除</div>
                  </div>
                  <div style="display:flex;gap:10px;">
                    <div style="background:rgba(167,139,250,0.08);border-radius:10px;padding:8px 12px;flex:1;"><div style="font-size:10px;color:var(--text-3);">{{ pol.freq }}</div><div style="font-size:13px;font-weight:700;color:#A78BFA;">{{ pol.premiumText }}</div></div>
                    <div style="background:rgba(233,180,76,0.08);border-radius:10px;padding:8px 12px;flex:1;"><div style="font-size:10px;color:var(--text-3);">到期日</div><div style="font-size:13px;font-weight:700;color:#E9B44C;">{{ pol.expiry }}</div></div>
                  </div>
                </div>
              </sc-for>
            </sc-if>
            <sc-if value="{{ noPolicies }}" hint-placeholder-val="{{ true }}">
              <div style="background:var(--card-bg);border-radius:20px;padding:28px 20px;border:1px solid var(--border-1);display:flex;flex-direction:column;align-items:center;">
                <div style="width:60px;height:60px;background:rgba(167,139,250,0.1);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;"><svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M15 2l9 3.6V14c0 5.6-3.6 10.2-9 13.2C9.6 24.2 6 19.6 6 14V5.6L15 2z" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                <div style="font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:6px;">尚無保單記錄</div>
                <div style="font-size:12px;color:var(--text-3);text-align:center;line-height:1.6;margin-bottom:18px;">點擊右上角「+ 新增保單」<br>開始建立您的保障清單</div>
              </div>

          </sc-if>
          <sc-if value="{{ isCoverage }}" hint-placeholder-val="{{ false }}">
            <div style="background:var(--card-bg);border-radius:20px;padding:18px 16px;border:1px solid var(--border-1);margin-bottom:14px;">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;">保障缺口分析</div>
              <div style="font-size:11px;color:var(--text-3);margin-bottom:18px;">各項保障充足度評估</div>
              <sc-for list="{{ coverageItems }}" as="cov" hint-placeholder-count="4">
                <div style="margin-bottom:16px;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:7px;">
                    <span style="font-size:13px;color:var(--text-2);font-weight:500;">{{ cov.label }}</span>
                    <span style="font-size:12px;font-weight:600;color:{{ cov.statusColor }};">{{ cov.statusText }}</span>
                  </div>
                  <div style="background:var(--border-3);border-radius:6px;height:7px;overflow:hidden;"><div style="width:{{ cov.pctWidth }};height:100%;background:{{ cov.barColor }};border-radius:6px;transition:width 0.5s ease;"></div></div>
                  <div style="font-size:11px;color:var(--text-3);margin-top:4px;">建議：{{ cov.target }}</div>

              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="var(--text-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <div onClick="{{ goAI }}" style="background:var(--card-bg);border-radius:16px;padding:14px 16px;border:1px solid rgba(108,142,245,0.15);display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
              <div style="display:flex;align-items:center;gap:11px;"><div style="width:38px;height:38px;background:linear-gradient(135deg,rgba(108,142,245,0.2),rgba(167,139,250,0.2));border-radius:12px;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2l2.2 4.9 4.8.5-3.5 3.3 1 5-4.5-2.4-4.5 2.4 1-5L1 7.4l4.8-.5L9 2z" stroke="#6C8EF5" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div><div style="font-size:14px;font-weight:600;color:var(--text-1);">AI 智慧分析</div><div style="font-size:11px;color:var(--text-3);">個人化財務建議</div></div></div>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="var(--text-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <div onClick="{{ goSettings }}" style="background:var(--card-bg);border-radius:16px;padding:14px 16px;border:1px solid var(--border-1);display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
              <div style="display:flex;align-items:center;gap:11px;"><div style="width:38px;height:38px;background:rgba(90,96,128,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="var(--text-3b)" stroke-width="1.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4" stroke="var(--text-3b)" stroke-width="1.4" stroke-linecap="round"/></svg></div><div><div style="font-size:14px;font-weight:600;color:var(--text-1);">帳戶設定</div><div style="font-size:11px;color:var(--text-3);">個人資料與偏好</div></div></div>

        <!-- ASSETS sub-page -->

              <div style="font-size:12px;color:var(--text-3);margin-bottom:5px;letter-spacing:0.5px;">總資產</div>

              <div style="font-size:11px;color:var(--text-3);margin-top:4px;">{{ assetLastUpdated }}</div>
            </div>
            <div style="background:var(--card-bg);border-radius:20px;padding:18px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:14px;">資產分類</div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <sc-for list="{{ assetItems }}" as="ast" hint-placeholder-count="4">

                      <sc-if value="{{ ast.isCustom }}" hint-placeholder-val="{{ false }}">
                        <div onClick="{{ ast.onDelete }}" style="font-size:11px;color:var(--text-6);cursor:pointer;padding:3px 8px;background:rgba(248,113,113,0.07);border-radius:8px;">刪除</div>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>
                <div onClick="{{ openAddAssetCat }}" style="display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;background:rgba(108,142,245,0.05);border-radius:12px;border:1px dashed rgba(108,142,245,0.22);cursor:pointer;margin-top:2px;">
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v11M2 7.5h11" stroke="#6C8EF5" stroke-width="1.8" stroke-linecap="round"/></svg>
                  <span style="font-size:13px;color:#6C8EF5;font-weight:600;">新增資產類別</span>
                </div>
              </div>
            </div>
            <!-- Asset History -->

                  <div style="font-size:14px;font-weight:700;color:var(--text-1);">異動紀錄</div>
                  <div onClick="{{ clearAssetHistory }}" style="font-size:11px;color:var(--text-6);cursor:pointer;">清除</div>
                </div>
                <sc-for list="{{ assetHistoryDisplay }}" as="rec" hint-placeholder-count="0">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--input-bg);">
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div style="width:32px;height:32px;background:{{ rec.dotBg }};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">{{ rec.emoji }}</div>
                      <div><div style="font-size:13px;color:var(--text-2);font-weight:500;">{{ rec.assetType }}</div><div style="font-size:11px;color:var(--text-3);margin-top:1px;">{{ rec.dateDisplay }}</div></div>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:13px;font-weight:700;color:var(--text-1);">{{ rec.newAmountText }}</div>
                      <div style="font-size:10px;color:{{ rec.changeColor }};margin-top:1px;">{{ rec.changeText }}</div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ noAssetHistory }}" hint-placeholder-val="{{ true }}">
              <div style="background:rgba(255,255,255,0.02);border-radius:16px;padding:14px;border:1px dashed var(--border-3);text-align:center;">
                <div style="font-size:12px;color:var(--text-5);">點「編輯」設定基準金額與連動帳戶，之後記帳就會自動加減，每次手動校正也會留下紀錄</div>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <!-- AI sub-page -->
        <sc-if value="{{ isProfileAI }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="background:linear-gradient(135deg,rgba(108,142,245,0.14),rgba(167,139,250,0.14));border-radius:20px;padding:24px;border:1px solid rgba(108,142,245,0.22);text-align:center;">
              <div style="width:58px;height:58px;background:linear-gradient(135deg,#6C8EF5,#A78BFA);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M13 3l3.2 7.2 7.3.6-5.3 5 1.6 7.5L13 19.4l-6.8 3.9 1.6-7.5-5.3-5 7.3-.6L13 3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
              <div style="font-size:18px;font-weight:800;color:var(--text-1);margin-bottom:6px;">AI 財務助理</div>
              <div style="font-size:12px;color:var(--text-4);line-height:1.6;">根據您的財務資料，提供個人化<br>收支分析、預算建議與保障規劃</div>
            </div>
            <div style="background:var(--card-bg);border-radius:14px;padding:14px;border:1px solid var(--border-1);display:flex;align-items:center;gap:11px;"><span style="font-size:22px;">📊</span><div><div style="font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:2px;">財務健康評分</div><div style="font-size:11px;color:var(--text-3);">分析收支比例、儲蓄率與負債狀況</div></div></div>
            <div style="background:var(--card-bg);border-radius:14px;padding:14px;border:1px solid var(--border-1);display:flex;align-items:center;gap:11px;"><span style="font-size:22px;">🎯</span><div><div style="font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:2px;">目標規劃建議</div><div style="font-size:11px;color:var(--text-3);">協助規劃退休、購屋等財務目標</div></div></div>
            <div style="background:var(--card-bg);border-radius:14px;padding:14px;border:1px solid var(--border-1);display:flex;align-items:center;gap:11px;"><span style="font-size:22px;">🛡️</span><div><div style="font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:2px;">保障缺口診斷</div><div style="font-size:11px;color:var(--text-3);">評估保險是否覆蓋主要風險</div></div></div>
            <div onClick="{{ triggerAI }}" style="background:linear-gradient(135deg,#6C8EF5,#A78BFA);border-radius:20px;padding:15px;text-align:center;cursor:pointer;font-size:15px;font-weight:700;color:#fff;">開始 AI 分析</div>
          </div>

        <!-- SETTINGS sub-page -->
        <sc-if value="{{ isProfileSettings }}" hint-placeholder-val="{{ false }}">

                <div><div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">姓名</div><input type="text" value="{{ profileName }}" onChange="{{ onProfileName }}" placeholder="請輸入姓名" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:14px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" /></div>
                <div><div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">電子郵件</div><input type="email" value="{{ profileEmail }}" onChange="{{ onProfileEmail }}" placeholder="請輸入 Email" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:14px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" /></div>
                <div><div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">月收入（用於 AI 分析）</div><input type="number" value="{{ profileMonthlyIncome }}" onChange="{{ onProfileIncome }}" placeholder="0" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:14px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" min="0" /></div>
              </div>
            </div>
            <!-- ═══ 雲端同步（由 build_index.py 插入設定頁） ═══ -->
            <div style="background:var(--card-bg);border-radius:20px;padding:18px;border:1px solid rgba(52,211,153,0.18);">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;">
                <div style="width:30px;height:30px;background:rgba(52,211,153,0.12);border-radius:10px;display:flex;align-items:center;justify-content:center;">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4.5 12.5a3 3 0 01-.4-5.97A4 4 0 0111.8 5.6a2.9 2.9 0 01-.3 6.9H4.5z" stroke="#34D399" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10.5V6M6.2 7.8L8 6l1.8 1.8" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div style="font-size:14px;font-weight:700;color:var(--text-1);">雲端同步</div>
              </div>
              <div style="font-size:11px;color:var(--text-3);line-height:1.6;margin-bottom:14px;">資料會存到你自己 Google 雲端硬碟裡的試算表，換裝置也看得到。</div>

              <sc-if value="{{ syncNotConfigured }}" hint-placeholder-val="{{ false }}">
                <div style="background:rgba(233,180,76,0.08);border:1px solid rgba(233,180,76,0.2);border-radius:12px;padding:12px;">
                  <div style="font-size:12px;font-weight:600;color:#E9B44C;margin-bottom:4px;">尚未設定</div>
                  <div style="font-size:11px;color:var(--text-4);line-height:1.7;">請在 <span style="font-family:monospace;">pwa/config.js</span> 填入 Google OAuth 用戶端 ID 後重新部署。</div>
                </div>
              </sc-if>

              <sc-if value="{{ syncConfigured }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:var(--input-bg);border-radius:12px;border:1px solid var(--border-2);margin-bottom:10px;">

                  <div style="font-size:10px;color:var(--text-4);line-height:1.7;margin-top:8px;">只會要求「存取本應用程式建立的檔案」權限，看不到你雲端硬碟裡的其他東西。</div>
                </sc-if>

                <sc-if value="{{ syncConnected }}" hint-placeholder-val="{{ false }}">

                    <div onClick="{{ toggleSyncAuto }}" style="width:46px;height:26px;background:{{ syncAutoToggleBg }};border-radius:13px;position:relative;cursor:pointer;transition:background 0.3s;flex-shrink:0;"><div style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;{{ syncAutoToggleDot }};box-shadow:0 2px 6px rgba(0,0,0,0.25);transition:all 0.25s;"></div></div>
                  </div>
                  <div style="display:flex;gap:8px;margin-top:12px;">
                    <div onClick="{{ syncNow }}" style="flex:2;padding:12px;text-align:center;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.25);border-radius:14px;font-size:13px;font-weight:700;color:#34D399;cursor:pointer;">立即同步</div>
                    <div onClick="{{ disconnectSync }}" style="flex:1;padding:12px;text-align:center;background:var(--border-1);border-radius:14px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;">中斷</div>
                  </div>
                  <sc-if value="{{ hasSyncSheet }}" hint-placeholder-val="{{ false }}">
                    <a href="{{ syncSheetUrl }}" target="_blank" rel="noopener" style="display:block;text-align:center;font-size:11px;color:#6C8EF5;font-weight:600;margin-top:12px;">在 Google 試算表開啟 →</a>
                  </sc-if>
                </sc-if>
              </sc-if>

            <div style="background:var(--card-bg);border-radius:20px;padding:18px;border:1px solid var(--border-1);">
              <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:14px;">顯示與通知</div>
              <div style="display:flex;flex-direction:column;">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border-1);">
                  <div><div style="font-size:13px;color:var(--text-2);font-weight:500;">深色模式</div><div style="font-size:11px;color:var(--text-3);margin-top:1px;">切換深色／淺色介面</div></div>

                <div style="font-size:22px;margin-bottom:4px;">{{ cat.emoji }}</div>

  <!-- ═══ POLICY SHEET ═══ -->

          <div style="display:flex;gap:10px;">

            <div style="flex:1;"><div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">繳費頻率</div>
              <select value="{{ policyFreq }}" onChange="{{ onPolicyFreq }}" style="background:var(--app-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 10px;color:var(--text-1);font-size:13px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;-webkit-appearance:none;appearance:none;">
                <option value="年繳">年繳</option>
                <option value="半年繳">半年</option>

          <div style="display:flex;gap:10px;padding-top:4px;">
            <div onClick="{{ closePolicySheet }}" style="flex:1;padding:14px;text-align:center;background:var(--border-1);border-radius:16px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;">取消</div>
            <div onClick="{{ submitPolicy }}" style="flex:2;padding:14px;text-align:center;background:linear-gradient(135deg,#A78BFA,#6C8EF5);border-radius:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;">新增保單</div>
          </div>
        </div>
      </div>
    </div>

  <!-- ═══ SCAN SHEET ═══ -->
  <sc-if value="{{ showScanSheet }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:60;">
      <div onClick="{{ closeScanSheet }}" style="position:absolute;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);border-radius:24px 24px 0 0;border-top:1px solid rgba(108,142,245,0.25);max-height:86%;display:flex;flex-direction:column;animation:sheetUp 0.38s cubic-bezier(0.16,1,0.3,1);">
        <div style="padding:14px 20px 12px;border-bottom:1px solid var(--border-1);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;justify-content:center;position:absolute;left:50%;transform:translateX(-50%);top:12px;"><div style="width:36px;height:4px;background:var(--border-4);border-radius:2px;"></div></div>

              <div style="width:100%;max-width:280px;height:190px;border:2px solid #6C8EF5;border-radius:16px;position:relative;background:rgba(108,142,245,0.05);display:flex;align-items:center;justify-content:center;overflow:hidden;">
                <div style="position:absolute;top:0;left:0;width:16px;height:16px;border-top:3px solid #6C8EF5;border-left:3px solid #6C8EF5;border-radius:4px 0 0 0;"></div>
                <div style="position:absolute;top:0;right:0;width:16px;height:16px;border-top:3px solid #6C8EF5;border-right:3px solid #6C8EF5;border-radius:0 4px 0 0;"></div>
                <div style="position:absolute;bottom:0;left:0;width:16px;height:16px;border-bottom:3px solid #6C8EF5;border-left:3px solid #6C8EF5;border-radius:0 0 0 4px;"></div>
                <div style="position:absolute;bottom:0;right:0;width:16px;height:16px;border-bottom:3px solid #6C8EF5;border-right:3px solid #6C8EF5;border-radius:0 0 4px 0;"></div>
                <div style="text-align:center;padding:0 16px;"><div style="font-size:36px;margin-bottom:8px;">🧾</div><div style="font-size:12px;color:var(--text-3);line-height:1.6;">拍下整張發票<br>對準 QR Code 辨識最準確</div></div>
              </div>
              <div style="font-size:12px;color:var(--text-4);text-align:center;line-height:1.6;">電子發票 QR Code：直接讀出金額與日期<br>一般收據：自動文字辨識（OCR）填入金額</div>
              <label style="background:linear-gradient(135deg,#6C8EF5,#A78BFA);border-radius:18px;padding:14px 20px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;width:100%;text-align:center;box-shadow:0 6px 20px rgba(108,142,245,0.35);display:block;">📷 拍照掃描
                <input type="file" accept="image/*" capture="environment" onChange="{{ onScanFile }}" style="display:none;" />
              </label>
              <label style="background:var(--border-1);border:1px solid var(--border-2);border-radius:18px;padding:12px 20px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;width:100%;text-align:center;display:block;">🖼 從相簿選擇照片
                <input type="file" accept="image/*" onChange="{{ onScanFile }}" style="display:none;" />
              </label>
            </div>
          </sc-if>
          <!-- SCANNING -->
          <sc-if value="{{ isScanScanning }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;">
              <div style="width:100%;max-width:280px;height:190px;border:2px solid #6C8EF5;border-radius:16px;position:relative;overflow:hidden;background:rgba(108,142,245,0.05);">
                <img src="{{ scanImage }}" style="width:100%;height:100%;object-fit:cover;opacity:0.5;" />
                <div style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#6C8EF5,transparent);animation:scanLine 1.5s ease-in-out infinite;box-shadow:0 0 8px rgba(108,142,245,0.8);"></div>
                <div style="position:absolute;top:0;left:0;width:16px;height:16px;border-top:3px solid #6C8EF5;border-left:3px solid #6C8EF5;border-radius:4px 0 0 0;"></div>
                <div style="position:absolute;top:0;right:0;width:16px;height:16px;border-top:3px solid #6C8EF5;border-right:3px solid #6C8EF5;border-radius:0 4px 0 0;"></div>
                <div style="position:absolute;bottom:0;left:0;width:16px;height:16px;border-bottom:3px solid #6C8EF5;border-left:3px solid #6C8EF5;border-radius:0 0 0 4px;"></div>
                <div style="position:absolute;bottom:0;right:0;width:16px;height:16px;border-bottom:3px solid #6C8EF5;border-right:3px solid #6C8EF5;border-radius:0 0 4px 0;"></div>
              </div>
              <div style="font-size:14px;font-weight:600;color:var(--text-1);">{{ scanStatusText }}</div>
              <div style="width:100%;max-width:280px;background:var(--border-3);border-radius:6px;height:6px;overflow:hidden;"><div style="width:{{ scanProgressWidth }};height:100%;background:linear-gradient(90deg,#6C8EF5,#A78BFA);border-radius:6px;transition:width 0.3s ease;"></div></div>
              <div style="font-size:11px;color:var(--text-4);text-align:center;line-height:1.6;">第一次辨識需要下載語言模型<br>之後會快很多</div>
            </div>
          </sc-if>
          <!-- RESULT -->
          <sc-if value="{{ isScanResult }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:12px;padding-bottom:20px;">
              <div style="display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(108,142,245,0.1),rgba(167,139,250,0.1));border-radius:18px;padding:14px;border:1px solid rgba(108,142,245,0.2);">
                <img src="{{ scanImage }}" style="width:62px;height:62px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-2);" />

                  <div style="font-size:11px;color:var(--text-3);margin-bottom:3px;">{{ scanSourceLabel }}</div>
                  <div style="font-size:22px;font-weight:800;color:var(--text-1);letter-spacing:-0.8px;">{{ scanHeadline }}</div>
                  <sc-if value="{{ hasScanInvNo }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;color:var(--text-4);margin-top:3px;">發票號碼 {{ scanInvNo }}</div></sc-if>
                </div>
              </div>

                <div style="background:rgba(233,180,76,0.1);border:1px solid rgba(233,180,76,0.28);border-radius:12px;padding:10px 12px;font-size:11px;color:#E9B44C;line-height:1.6;">{{ scanError }}</div>
              </sc-if>
              <div>
                <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">金額 (NT$)</div>

              </div>
              <div>
                <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">商家 / 備註</div>
                <input type="text" value="{{ scanShop }}" onChange="{{ onScanShop }}" placeholder="例：全聯福利中心" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:13px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" />
              </div>
              <div style="display:flex;gap:10px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">類別</div>
                  <select value="{{ scanCategory }}" onChange="{{ onScanCategory }}" style="background:var(--app-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 12px;color:var(--text-1);font-size:13px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;-webkit-appearance:none;appearance:none;">
                    <sc-for list="{{ scanCatOptions }}" as="c" hint-placeholder-count="3">
                      <option value="{{ c.value }}">{{ c.label }}</option>
                    </sc-for>
                  </select>
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">帳戶 / 銀行</div>
                  <select value="{{ scanBank }}" onChange="{{ onScanBank }}" style="background:var(--app-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 12px;color:var(--text-1);font-size:13px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;-webkit-appearance:none;appearance:none;">
                    <sc-for list="{{ scanBankOptions }}" as="bk" hint-placeholder-count="3">
                      <option value="{{ bk.value }}">{{ bk.label }}</option>
                    </sc-for>
                  </select>
                </div>
              </div>
              <div>
                <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">日期</div>
                <input type="date" value="{{ scanDate }}" onChange="{{ onScanDate }}" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:13px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;color-scheme:{{ colorScheme }};" />
              </div>
              <sc-if value="{{ hasScanItems }}" hint-placeholder-val="{{ false }}">
                <div style="background:var(--card-bg2);border-radius:16px;padding:14px 16px;border:1px solid var(--border-1);">
                  <div style="font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;">消費明細</div>
                  <sc-for list="{{ scanItems }}" as="item" hint-placeholder-count="3">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-1);font-size:13px;color:var(--text-2);">{{ item.text }}</div>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{ hasScanText }}" hint-placeholder-val="{{ false }}">
                <div>

                    <div style="margin-top:8px;background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:10px 12px;max-height:150px;overflow-y:auto;font-size:11px;color:var(--text-3);line-height:1.7;white-space:pre-wrap;word-break:break-all;">{{ scanText }}</div>

                </div>
              </sc-if>
              <div style="display:flex;gap:10px;">

              </div>
            </div>
          </sc-if>
        </div>
      </div>

  <!-- ═══ VOICE SHEET ═══ -->

      <div onClick="{{ closeVoiceSheet }}" style="position:absolute;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);"></div>

          <div style="font-size:17px;font-weight:800;color:var(--text-1);margin-top:16px;">🎤 語音輸入</div>
          <div onClick="{{ closeVoiceSheet }}" style="width:28px;height:28px;background:var(--border-1);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:16px;"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1L1 10" stroke="var(--text-3)" stroke-width="1.5" stroke-linecap="round"/></svg></div>

        <div style="overflow-y:auto;padding:24px 20px 32px;">
          <!-- READY -->

            <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
              <div onClick="{{ startVoice }}" style="width:100px;height:100px;background:linear-gradient(135deg,#A78BFA,#6C8EF5);border-radius:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 30px rgba(167,139,250,0.4);">
                <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="16" y="4" width="12" height="22" rx="6" fill="#fff" opacity="0.95"/><path d="M8 22c0 7.7 6.3 14 14 14s14-6.3 14-14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M22 36v5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
              </div>
              <div style="font-size:16px;font-weight:700;color:var(--text-1);">點擊麥克風開始錄音</div>
              <div style="font-size:12px;color:var(--text-3);text-align:center;line-height:1.7;">直接說出消費內容，例如：<br>「今天午餐吃了便當，花了 85 元」</div>
            </div>
          </sc-if>
          <!-- RECORDING -->
          <sc-if value="{{ isVoiceRecording }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
              <div style="display:flex;align-items:center;justify-content:center;gap:5px;height:60px;">
                <div style="width:5px;background:#A78BFA;border-radius:3px;animation:waveA 0.8s ease infinite;"></div>
                <div style="width:5px;background:#6C8EF5;border-radius:3px;animation:waveB 0.8s ease 0.1s infinite;"></div>
                <div style="width:5px;background:#A78BFA;border-radius:3px;animation:waveC 0.8s ease 0.2s infinite;"></div>
                <div style="width:5px;background:#6C8EF5;border-radius:3px;animation:waveB 0.8s ease 0.3s infinite;"></div>
                <div style="width:5px;background:#A78BFA;border-radius:3px;animation:waveA 0.8s ease 0.15s infinite;"></div>
                <div style="width:5px;background:#6C8EF5;border-radius:3px;animation:waveC 0.8s ease 0.25s infinite;"></div>
                <div style="width:5px;background:#A78BFA;border-radius:3px;animation:waveB 0.8s ease 0.05s infinite;"></div>
              </div>
              <div style="font-size:28px;font-weight:800;color:var(--text-1);letter-spacing:2px;font-variant-numeric:tabular-nums;">{{ voiceTimer }}</div>
              <div style="font-size:13px;color:#A78BFA;font-weight:600;">錄音中…</div>
              <div onClick="{{ stopVoice }}" style="background:#F87171;border-radius:18px;padding:14px 36px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(248,113,113,0.35);">■ 停止錄音</div>
            </div>
          </sc-if>
          <!-- ANALYZING -->
          <sc-if value="{{ isVoiceAnalyzing }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0;">
              <div style="width:64px;height:64px;border:3px solid rgba(167,139,250,0.2);border-top-color:#A78BFA;border-radius:50%;animation:spin 1s linear infinite;"></div>
              <div style="font-size:15px;font-weight:700;color:var(--text-1);">解析語音內容…</div>
              <div style="font-size:12px;color:var(--text-3);">識別金額、類別與備註資訊</div>
            </div>
          </sc-if>
          <!-- RESULT -->
          <sc-if value="{{ isVoiceResult }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:14px;">
              <div style="background:rgba(167,139,250,0.08);border-radius:16px;padding:14px 16px;border:1px solid rgba(167,139,250,0.18);">
                <div style="font-size:11px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:5px;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="4" y="1" width="4" height="7" rx="2" stroke="#A78BFA" stroke-width="1.2"/><path d="M2 6.5C2 8.7 3.8 10.5 6 10.5s4-1.8 4-4" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round"/></svg>辨識內容</div>
                <div style="font-size:14px;color:var(--text-1);line-height:1.6;font-style:italic;">「{{ voiceText }}」</div>
              </div>
              <div style="background:var(--card-bg2);border-radius:16px;padding:16px;border:1px solid var(--border-1);">
                <div style="font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:12px;">語音解析結果</div>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--text-3);">金額</span><span style="font-size:18px;font-weight:800;color:#F87171;">{{ voiceAmount }}</span></div>
                  <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--text-3);">類別</span><span style="font-size:13px;font-weight:600;color:#6C8EF5;">{{ voiceCategory }}</span></div>
                  <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--text-3);">備註</span><span style="font-size:13px;color:var(--text-2);">{{ voiceNote }}</span></div>
                </div>
              </div>
              <div style="display:flex;gap:10px;">
                <div onClick="{{ closeVoiceSheet }}" style="flex:1;padding:14px;text-align:center;background:var(--border-1);border-radius:16px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;">取消</div>
                <div onClick="{{ confirmVoice }}" style="flex:2;padding:14px;text-align:center;background:linear-gradient(135deg,#A78BFA,#6C8EF5);border-radius:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;">✓ 確認記錄</div>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

<!-- ═══ 同步衝突（由 build_index.py 插入） ═══ -->
<sc-if value="{{ showSyncConflict }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:70;">
    <div onClick="{{ closeSyncConflict }}" style="position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);border-radius:24px 24px 0 0;border-top:1px solid rgba(233,180,76,0.3);padding:16px 20px 40px;animation:sheetUp 0.35s cubic-bezier(0.16,1,0.3,1);">
      <div style="display:flex;justify-content:center;margin-bottom:16px;"><div style="width:36px;height:4px;background:var(--border-4);border-radius:2px;"></div></div>
      <div style="font-size:18px;font-weight:800;color:var(--text-1);margin-bottom:6px;">⚠️ 同步衝突</div>
      <div style="font-size:13px;color:var(--text-3);line-height:1.7;margin-bottom:8px;">{{ syncConflictText }}</div>
      <div style="font-size:11px;color:var(--text-4);line-height:1.7;margin-bottom:20px;">選擇後另一份會被覆蓋，這個動作無法復原。</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div onClick="{{ resolveSyncLocal }}" style="padding:14px;text-align:center;background:linear-gradient(135deg,#6C8EF5,#A78BFA);border-radius:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;">保留這台裝置的資料（上傳覆蓋雲端）</div>
        <div onClick="{{ resolveSyncRemote }}" style="padding:14px;text-align:center;background:var(--input-bg);border:1px solid var(--border-2);border-radius:16px;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;">保留雲端的資料（下載覆蓋本機）</div>
        <div onClick="{{ closeSyncConflict }}" style="padding:12px;text-align:center;font-size:13px;font-weight:600;color:var(--text-4);cursor:pointer;">稍後再決定</div>
      </div>
    </div>
  </div>
</sc-if>

  <!-- ═══ ADD ASSET CATEGORY SHEET ═══ -->
  <sc-if value="{{ showAddAssetCat }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:60;">
      <div onClick="{{ closeAddAssetCat }}" style="position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);border-radius:24px 24px 0 0;border-top:1px solid rgba(108,142,245,0.2);max-height:82%;display:flex;flex-direction:column;animation:sheetUp 0.38s cubic-bezier(0.16,1,0.3,1);">
        <div style="padding:14px 20px 12px;border-bottom:1px solid var(--border-1);flex-shrink:0;">
          <div style="display:flex;justify-content:center;margin-bottom:12px;"><div style="width:36px;height:4px;background:var(--border-4);border-radius:2px;"></div></div>
          <div style="font-size:18px;font-weight:800;color:var(--text-1);">新增資產類別</div>
        </div>
        <div style="overflow-y:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:16px;">
          <!-- Emoji picker -->
          <div>
            <div style="font-size:11px;color:var(--text-4);margin-bottom:10px;font-weight:500;">選擇圖示</div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
              <div style="width:52px;height:52px;background:rgba(108,142,245,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:1px solid rgba(108,142,245,0.2);">{{ newAssetEmoji }}</div>
              <input type="text" value="{{ newAssetEmoji }}" onChange="{{ onNewAssetEmoji }}" placeholder="輸入 emoji" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:18px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" maxlength="2" />
            </div>
            <div style="display:flex;gap:7px;flex-wrap:wrap;">
              <sc-for list="{{ emojiOptions }}" as="eo" hint-placeholder-count="12">
                <div onClick="{{ eo.onPick }}" style="width:38px;height:38px;background:{{ eo.bg }};border:{{ eo.border }};border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;">{{ eo.emoji }}</div>
              </sc-for>
            </div>
          </div>
          <!-- Name -->
          <div>
            <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">類別名稱 *</div>
            <input type="text" value="{{ newAssetName }}" onChange="{{ onNewAssetName }}" placeholder="例：加密貨幣、黃金、車輛…" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:14px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" />
          </div>
          <!-- Initial amount -->
          <div>
            <div style="font-size:11px;color:var(--text-4);margin-bottom:6px;font-weight:500;">初始金額 (NT$)（選填）</div>
            <input type="number" value="{{ newAssetAmount }}" onChange="{{ onNewAssetAmount }}" placeholder="0" min="0" style="background:var(--input-bg);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;color:var(--text-1);font-size:14px;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" />
          </div>
          <div style="display:flex;gap:10px;padding-top:4px;">
            <div onClick="{{ closeAddAssetCat }}" style="flex:1;padding:14px;text-align:center;background:var(--border-1);border-radius:16px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;">取消</div>
            <div onClick="{{ submitAddAssetCat }}" style="flex:2;padding:14px;text-align:center;background:linear-gradient(135deg,#6C8EF5,#A78BFA);border-radius:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;">新增類別</div>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- ═══ ASSET SHEET ═══ -->
  <sc-if value="{{ showAssetSheet }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:60;">
      <div onClick="{{ closeAssetSheet }}" style="position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);border-radius:24px 24px 0 0;border-top:1px solid rgba(52,211,153,0.2);padding:16px 20px 40px;max-height:86%;overflow-y:auto;animation:sheetUp 0.35s cubic-bezier(0.16,1,0.3,1);">
        <div style="display:flex;justify-content:center;margin-bottom:16px;"><div style="width:36px;height:4px;background:var(--border-4);border-radius:2px;"></div></div>
        <div style="font-size:18px;font-weight:800;color:var(--text-1);margin-bottom:4px;">{{ editAssetType }}</div>
        <div style="font-size:13px;color:var(--text-3);margin-bottom:22px;">輸入目前持有金額，並選擇要連動的帳戶</div>
        <div style="margin-bottom:22px;">
          <div style="font-size:11px;color:var(--text-4);margin-bottom:8px;font-weight:500;">目前金額 (NT$)</div>
          <input type="number" value="{{ editAssetAmount }}" onChange="{{ onAssetAmount }}" placeholder="0" min="0" style="background:var(--input-bg);border:1px solid rgba(52,211,153,0.25);border-radius:14px;padding:14px 18px;color:var(--text-1);font-size:22px;font-weight:700;width:100%;outline:none;font-family:Plus Jakarta Sans,sans-serif;" />
        </div>
        <div style="margin-bottom:22px;">
          <div style="font-size:11px;color:var(--text-4);margin-bottom:8px;font-weight:500;">連動帳戶</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;">
            <sc-for list="{{ editAssetBankChips }}" as="bc" hint-placeholder-count="3">
              <div onClick="{{ bc.onToggle }}" style="padding:7px 11px;border-radius:11px;background:{{ bc.bg }};border:{{ bc.border }};color:{{ bc.color }};font-size:12px;font-weight:600;cursor:pointer;">{{ bc.label }}</div>
            </sc-for>
          </div>
          <div style="font-size:10px;color:var(--text-4);margin-top:8px;line-height:1.6;">勾選的帳戶在帳簿記一筆，這個類別的金額就跟著加減。上面填的金額會成為新的基準，之後記的帳從這個數字往上算。</div>
        </div>
        <div style="display:flex;gap:10px;">
          <div onClick="{{ closeAssetSheet }}" style="flex:1;padding:14px;text-align:center;background:var(--border-1);border-radius:16px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;">取消</div>
          <div onClick="{{ submitAsset }}" style="flex:2;padding:14px;text-align:center;background:linear-gradient(135deg,#34D399,#6C8EF5);border-radius:16px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;">儲存</div>
        </div>
      </div>
    </div>
  </sc-if></script>

<script src="./vendor/chart.umd.min.js"></script>
<script src="./config.js"></script>
<script src="./runtime.js"></script>
<script src="./app.js"></script>
<script src="./sync.js"></script>
<script src="./boot.js"></script>
<script>
/* ── Service Worker：離線可用 ─────────────────────────────── */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service Worker 註冊失敗：', err);
    });
  });
}

/* ── 加入主畫面 ───────────────────────────────────────────── */
(function () {
  var bar = document.getElementById('install-bar');
  var deferred = null;
  var HIDDEN = 'financeapp_install_dismissed';

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    try { if (localStorage.getItem(HIDDEN)) return; } catch (err) {}
    bar.style.display = 'flex';
  });
  document.getElementById('install-yes').addEventListener('click', function () {
    bar.style.display = 'none';
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { deferred = null; });
  });
  document.getElementById('install-no').addEventListener('click', function () {
    bar.style.display = 'none';
    try { localStorage.setItem(HIDDEN, '1'); } catch (err) {}
  });
  window.addEventListener('appinstalled', function () { bar.style.display = 'none'; });
})();
</script>
</body>
</html>
